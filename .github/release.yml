changelog:
  exclude:
    labels:
      - dependencies
      - chore
      - maintenance
      - ci
      - build
      - automated
      - duplicate
      - invalid
      - wontfix
      - skip-changelog
    authors:
      - dependabot[bot]
      - renovate[bot]
      - github-actions[bot]

  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Flutter Transition
      labels:
        - flutter
        - flutter-transition
