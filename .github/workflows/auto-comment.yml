name: Auto Thank on Merge

on:
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Job 1: Label the PR when it is opened or updated (before merge)
  label-pr:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Auto-label PR
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const prNumber = context.payload.pull_request.number;
              const pr = context.payload.pull_request;
              const prAuthor = pr?.user?.login;
              
              // Skip bots
              if (pr?.user?.type === 'Bot' || prAuthor === 'dependabot[bot]') {
                console.log(`Skipping bot PR #${prNumber} by ${prAuthor}`);
                return;
              }
              
              // Fetch files changed in this PR using pagination
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100
              });
              
              let hasUI = false;
              let hasBackend = false;
              let hasTests = false;
              let hasDocs = false;
              let fileCount = files.length;
              
              for (const file of files) {
                const filename = file.filename;
                if (filename.includes('__tests__/') || filename.endsWith('.test.ts') || filename.endsWith('.test.tsx')) {
                  hasTests = true;
                } else if (
                  filename.startsWith('src/components/') || 
                  (filename.startsWith('src/app/') && !filename.includes('/api/') && (filename.endsWith('.tsx') || filename.endsWith('.css')))
                ) {
                  hasUI = true;
                } else if (
                  filename.startsWith('src/app/api/') || 
                  filename.startsWith('prisma/') || 
                  filename.startsWith('src/lib/') || 
                  filename === 'src/middleware.ts'
                ) {
                  hasBackend = true;
                } else if (
                  filename === 'README.md' ||
                  filename.startsWith('docs/') ||
                  filename.endsWith('.md')
                ) {
                  hasDocs = true;
                }
              }

              // Assign labels logically based on modified files
              const labelsToAdd = ['ECSoC26'];
              
              if (hasBackend) {
                labelsToAdd.push('good-backend');
              }
              if (hasUI) {
                labelsToAdd.push('good-ui');
              }
              if (hasTests || hasDocs) {
                labelsToAdd.push('good-pr');
              }
              
              // Fallback: If no bonus labels were matched, assign 'good-pr'
              if (!hasBackend && !hasUI && !hasTests && !hasDocs) {
                labelsToAdd.push('good-pr');
              }
              
              console.log(`Auto-assigning labels pre-merge for PR #${prNumber}: ${labelsToAdd.join(', ')}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: labelsToAdd
              });
            } catch (err) {
              console.warn('Auto-label warning (gracefully caught):', err.message);
            }

  # Job 2: Thank contributor and summarize XP when merged
  thank-contributor:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Thank Contributor
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const prNumber = context.payload.pull_request.number;
              const pr = context.payload.pull_request;
              const prAuthor = pr?.user?.login;
              
              // Skip bots
              if (pr?.user?.type === 'Bot' || prAuthor === 'dependabot[bot]') {
                console.log(`Skipping bot PR #${prNumber} by ${prAuthor}`);
                return;
              }
              
              // Fetch files changed in this PR using pagination
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100
              });
              
              let hasUI = false;
              let hasBackend = false;
              let hasTests = false;
              let hasDocs = false;
              
              for (const file of files) {
                const filename = file.filename;
                if (filename.includes('__tests__/') || filename.endsWith('.test.ts') || filename.endsWith('.test.tsx')) {
                  hasTests = true;
                } else if (
                  filename.startsWith('src/components/') || 
                  (filename.startsWith('src/app/') && !filename.includes('/api/') && (filename.endsWith('.tsx') || filename.endsWith('.css')))
                ) {
                  hasUI = true;
                } else if (
                  filename.startsWith('src/app/api/') || 
                  filename.startsWith('prisma/') || 
                  filename.startsWith('src/lib/') || 
                  filename === 'src/middleware.ts'
                ) {
                  hasBackend = true;
                } else if (
                  filename === 'README.md' ||
                  filename.startsWith('docs/') ||
                  filename.endsWith('.md')
                ) {
                  hasDocs = true;
                }
              }

              const bonusDetails = [];
              if (hasBackend) {
                bonusDetails.push('⚙️ **good-backend** (+50 XP) - for backend/API or DB improvements');
              }
              if (hasUI) {
                bonusDetails.push('🎨 **good-ui** (+25 XP) - for frontend/UI improvements');
              }
              if (hasTests || hasDocs) {
                bonusDetails.push('📝 **good-pr** (+15 XP) - for high-quality contributions with testing or details');
              }
              
              // Fallback detail
              if (bonusDetails.length === 0) {
                bonusDetails.push('📝 **good-pr** (+15 XP) - baseline contribution bonus');
              }

              let bonusSection = `\n\n### 🏆 Bonus XP Awarded!\nBased on our automated review, we have applied the following bonus labels to your PR:\n${bonusDetails.map(d => `- ${d}`).join('\n')}\n\nThese will be picked up by the ECSOC Sentinel scoring system shortly!`;

              const thankComment = `🎉 Congratulations!

              Your contribution has been merged.

              Thank you for improving WorkSphere.${bonusSection}`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: thankComment
              });
            } catch (err) {
              console.warn('Thank contributor warning (gracefully caught):', err.message);
            }

