name: Auto-Merge Linked PR

on:
  pull_request_target:
    branches: [main, master, dev, development]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge-linked-pr:
    name: Check Issue Link & Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge if linked to an issue
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;

              // Collect target PRs to evaluate
              let prsToProcess = [];

              if (context.payload.pull_request) {
                prsToProcess.push(context.payload.pull_request);
              } else if (context.payload.issue && context.payload.issue.pull_request) {
                // Triggered by comment on a PR
                try {
                  const prRes = await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: context.payload.issue.number
                  });
                  if (prRes.data && prRes.data.state === 'open') {
                    prsToProcess.push(prRes.data);
                  }
                } catch (e) {
                  console.warn('Could not fetch PR from issue comment:', e.message);
                }
              } else if (context.payload.workflow_run && context.payload.workflow_run.pull_requests?.length > 0) {
                // Triggered by CI completion
                for (const item of context.payload.workflow_run.pull_requests) {
                  try {
                    const prRes = await github.rest.pulls.get({
                      owner,
                      repo,
                      pull_number: item.number
                    });
                    if (prRes.data && prRes.data.state === 'open') {
                      prsToProcess.push(prRes.data);
                    }
                  } catch (e) {
                    console.warn(`Could not fetch PR #${item.number}:`, e.message);
                  }
                }
              } else {
                // Triggered by schedule or workflow_dispatch: sweep all open PRs
                console.log('Running automated sweep across all open pull requests...');
                try {
                  const openPrs = await github.paginate(github.rest.pulls.list, {
                    owner,
                    repo,
                    state: 'open',
                    per_page: 50
                  });
                  prsToProcess = openPrs;
                } catch (e) {
                  console.warn('Error fetching open PRs:', e.message);
                }
              }

              console.log(`Evaluating ${prsToProcess.length} pull request(s) for auto-merge...`);

              for (const pr of prsToProcess) {
                const prNumber = pr.number;
                const prAuthor = (pr.user?.login || '').toLowerCase();
                const title = pr.title || '';
                const rawBody = pr.body || '';
                const headRef = pr.head ? pr.head.ref : '';

                const BLOCKED_USERS = ['jasonjose007', 'Senthil455'];
                if (BLOCKED_USERS.some(u => u.toLowerCase() === prAuthor)) {
                  console.log(`Skipping blocked user @${prAuthor} on PR #${prNumber}`);
                  continue;
                }

                // Strip HTML comments and code blocks to prevent false matches from templates
                const body = rawBody
                  .replace(/<!--[\s\S]*?-->/g, '')
                  .replace(/```[\s\S]*?```/g, '')
                  .replace(/`[^`]*`/g, '');

                console.log(`Evaluating PR #${prNumber}: "${title}" by @${prAuthor}...`);

                let candidateIssueNumbers = new Set();

                // 1. Check official GitHub closingIssuesReferences via GraphQL
                try {
                  const query = `
                    query($owner: String!, $repo: String!, $number: Int!) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          closingIssuesReferences(first: 10) {
                            nodes {
                              number
                            }
                          }
                        }
                      }
                    }
                  `;
                  const gqlRes = await github.graphql(query, { owner, repo, number: prNumber });
                  const closingNodes = gqlRes?.repository?.pullRequest?.closingIssuesReferences?.nodes || [];
                  for (const node of closingNodes) {
                    if (node.number && node.number !== prNumber) {
                      candidateIssueNumbers.add(node.number);
                    }
                  }
                } catch (gqlErr) {
                  console.warn('GraphQL closingIssuesReferences query note:', gqlErr.message);
                }

                // 2. Check title / body / branch name with issue keywords
                const issuePattern = /(?:closes?|closed|fixes?|fixed|resolves?|resolved)\s*#?(\d+)/gi;
                let m;
                while ((m = issuePattern.exec(title)) !== null) {
                  const num = parseInt(m[1], 10);
                  if (num !== prNumber) candidateIssueNumbers.add(num);
                }
                while ((m = issuePattern.exec(body)) !== null) {
                  const num = parseInt(m[1], 10);
                  if (num !== prNumber) candidateIssueNumbers.add(num);
                }

                // Check branch ref (e.g. fix/issue-456 or issue-456)
                const branchMatch = headRef.match(/(?:fix|close|resolve|issue)[-/](\d+)/i);
                if (branchMatch) {
                  const num = parseInt(branchMatch[1], 10);
                  if (num !== prNumber) candidateIssueNumbers.add(num);
                }

                // 3. Validate candidate numbers against GitHub API (must be an existing Issue, NOT a PR)
                let linkedIssues = [];
                for (const num of candidateIssueNumbers) {
                  if (num === 123) continue; // Template placeholder
                  try {
                    const issueRes = await github.rest.issues.get({
                      owner,
                      repo,
                      issue_number: num
                    });
                    if (issueRes.data && !issueRes.data.pull_request) {
                      const assignees = (issueRes.data.assignees || []).map(a => a.login.toLowerCase());
                      const isMaintainer = ['satyampandey-07'].includes(prAuthor);
                      if (isMaintainer || assignees.includes(prAuthor)) {
                        linkedIssues.push(`#${num}`);
                      } else {
                        console.log(`Issue #${num} is not assigned to PR author @${prAuthor}. Not counted for auto-merge.`);
                      }
                    } else {
                      console.log(`Reference #${num} is a Pull Request, not an Issue. Ignored.`);
                    }
                  } catch (err) {
                    console.warn(`Could not verify #${num} as a valid issue:`, err.message);
                  }
                }

                const hasLinkedIssue = linkedIssues.length > 0;

                if (!hasLinkedIssue) {
                  console.log(`PR #${prNumber} is NOT linked to any valid assigned issue. Skipping.`);
                  if (context.payload.action === 'opened') {
                    const noticeMsg = `⚠️ **Issue Link Required for Auto-Merge**\n\n` +
                      `Hi @${prAuthor}, this pull request does not appear to be linked to an issue assigned to you.\n\n` +
                      `Please update your PR description to link your assigned issue:\n` +
                      `> \`Fixes #<issue_number>\` or \`Closes #<issue_number>\`\n\n` +
                      `*Once a valid issue is linked and checks pass, auto-merge will trigger automatically.*`;

                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: prNumber,
                      body: noticeMsg
                    }).catch(e => console.warn('Comment notice note:', e.message));

                    try {
                      await github.rest.issues.addLabels({
                        owner,
                        repo,
                        issue_number: prNumber,
                        labels: ['needs-issue']
                      });
                    } catch (e) {
                      console.warn('Label note:', e.message);
                    }
                  }
                  continue;
                }

                console.log(`PR #${prNumber} is linked to issue(s): ${linkedIssues.join(', ')}. Checking mergeability...`);

                // Remove needs-issue label if previously applied
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: 'needs-issue'
                  });
                } catch (e) {}

                // Auto-approve PR
                try {
                  await github.rest.pulls.createReview({
                    owner,
                    repo,
                    pull_number: prNumber,
                    event: 'APPROVE',
                    body: `✅ Auto-approved! This PR properly references assigned issue(s): ${linkedIssues.join(', ')}.`
                  });
                  console.log(`Auto-approved PR #${prNumber}`);
                } catch (approveErr) {
                  console.warn('Auto-approve note (may already be approved):', approveErr.message);
                }

                // Ensure WOCS labels are applied
                try {
                  const existingLabelsRes = await github.rest.issues.listLabelsOnIssue({
                    owner,
                    repo,
                    issue_number: prNumber
                  });
                  const existingLabels = existingLabelsRes.data.map(l => l.name.toLowerCase());

                  let wocsLevel = existingLabels.find(l => /^level\s*[123]$/i.test(l));

                  if (!wocsLevel) {
                    for (const rawNum of candidateIssueNumbers) {
                      try {
                        const iRes = await github.rest.issues.get({ owner, repo, issue_number: rawNum });
                        const iLabels = (iRes.data.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
                        const match = iLabels.find(l => /^level\s*[123]$/i.test(l));
                        if (match) {
                          wocsLevel = match;
                          break;
                        }
                      } catch (e) {}
                    }
                  }

                  const wocsLabelsToApply = ['wocs', wocsLevel || 'level 1'];
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: prNumber,
                    labels: wocsLabelsToApply
                  });
                  console.log(`Applied WOCS labels to PR #${prNumber}: ${wocsLabelsToApply.join(', ')}`);
                } catch (wocsErr) {
                  console.warn('WOCS label pre-merge warning:', wocsErr.message);
                }

                // Fetch latest mergeable status
                let prDetails;
                for (let attempt = 1; attempt <= 4; attempt++) {
                  const res = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                  prDetails = res.data;
                  if (prDetails.mergeable !== null) break;
                  console.log(`Waiting for GitHub to compute mergeability for PR #${prNumber} (attempt ${attempt}/4)...`);
                  await new Promise(r => setTimeout(r, 2000));
                }

                if (prDetails.mergeable === false || prDetails.mergeable_state === 'dirty') {
                  console.log(`PR #${prNumber} has merge conflicts (state: ${prDetails.mergeable_state}). Skipping auto-merge.`);
                  continue;
                }

                // Execute squash merge with co-author attribution
                const isMaintainer = prAuthor === 'satyampandey-07';
                let coAuthorTrailers = [];
                if (isMaintainer) {
                  coAuthorTrailers.push('Co-authored-by: Claude Opus 5.5 <noreply@anthropic.com>');
                } else {
                  coAuthorTrailers.push('Co-authored-by: Satyam Pandey <satyam53@tsecol.onmicrosoft.com>');
                  coAuthorTrailers.push('Co-authored-by: SatyamPandey-07 <186389297+SatyamPandey-07@users.noreply.github.com>');
                }

                const cleanDescription = (rawBody || '')
                  .replace(/<!--[\s\S]*?-->/g, '')
                  .trim();

                const missingTrailers = coAuthorTrailers.filter(trailer =>
                  !cleanDescription.toLowerCase().includes(trailer.toLowerCase())
                );

                const commitTitle = `${title} (#${prNumber})`;
                const commitMessage = missingTrailers.length > 0
                  ? `${cleanDescription}\n\n${missingTrailers.join('\n')}`
                  : cleanDescription;

                let mergeResponse = null;
                const maxMergeAttempts = 3;
                for (let attempt = 1; attempt <= maxMergeAttempts; attempt++) {
                  try {
                    console.log(`Attempting squash merge for PR #${prNumber} (attempt ${attempt}/${maxMergeAttempts})...`);
                    mergeResponse = await github.rest.pulls.merge({
                      owner,
                      repo,
                      pull_number: prNumber,
                      commit_title: commitTitle,
                      commit_message: commitMessage,
                      merge_method: 'squash'
                    });
                    if (mergeResponse?.data?.merged) {
                      break;
                    }
                  } catch (mergeErr) {
                    console.warn(`Merge attempt ${attempt} for PR #${prNumber} failed:`, mergeErr.message);
                    if (attempt < maxMergeAttempts) {
                      await new Promise(r => setTimeout(r, attempt * 3000));
                    }
                  }
                }

                if (mergeResponse?.data?.sha) {
                  console.log(`PR #${prNumber} successfully auto-merged! SHA: ${mergeResponse.data.sha}`);
                  const successMsg = `🚀 **Auto-merge complete!**\n\nThis pull request is linked to issue(s) ${linkedIssues.join(', ')} and has been automatically squash-merged into \`main\` with co-author credit! 🎉\n\nThank you for contributing to **WorkSphere**! ✨`;
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body: successMsg
                  }).catch(e => console.warn('Success comment note:', e.message));
                }
              }

            } catch (err) {
              console.error('Auto-merge workflow error (gracefully caught):', err.message);
            }
