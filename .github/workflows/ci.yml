name: Continuous Integration

on:
  pull_request:
    branches: [main, master, dev, development]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xvc2luZy12dWx0dXJlLTEwLmNsZXJrLmFjY291bnRzLmRldiQ
      CLERK_SECRET_KEY: sk_test_dummy
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /ai
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /ai
      NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL: /ai
      NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL: /ai
      GROQ_API_KEY: gsk_dummy
      PEXELS_API_KEY: dummy
      WHATSAPP_WEBHOOK_URL: https://example.com/webhook
      WHATSAPP_API_TOKEN: dummy
      WHATSAPP_PHONE_NUMBER_ID: dummy
      TWILIO_ACCOUNT_SID: ACdummy
      TWILIO_AUTH_TOKEN: dummy
      TWILIO_WHATSAPP_FROM: whatsapp:+14155238886
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_USER: dummy@example.com
      SMTP_PASS: dummy
      UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
      UPSTASH_REDIS_REST_TOKEN: dummy
      NEXT_PUBLIC_OSRM_URL: https://router.project-osrm.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Cache Next.js build output
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build Next.js application
        run: npm run build

  postgres-migration-and-integration:
    name: PostgreSQL Migration & Database Integration Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: worksphere_ci
          POSTGRES_PASSWORD: worksphere_ci_password
          POSTGRES_DB: worksphere_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksphere_ci -d worksphere_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://worksphere_ci:worksphere_ci_password@localhost:5432/worksphere_ci_test?schema=public
      INTEGRATION_DATABASE_URL: postgresql://worksphere_ci:worksphere_ci_password@localhost:5432/worksphere_ci_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install PostGIS and required extensions in PostgreSQL container
        shell: bash
        run: |
          # Keep extension modules ABI-compatible with the server image. This mirrors
          # .github/test-postgres/Dockerfile: install PostGIS and contrib only;
          # do not replace the image's PostgreSQL server/client packages.
          docker exec -u root ${{ job.services.postgres.id }} bash -c "apt-get update && apt-get install -y --no-install-recommends postgresql-16-postgis-3 postgresql-16-postgis-3-scripts postgresql-contrib-16 && rm -rf /var/lib/apt/lists/*"

      - name: Pre-enable required PostgreSQL extensions
        shell: bash
        env:
          PGPASSWORD: worksphere_ci_password
        run: |
          docker exec -e PGPASSWORD ${{ job.services.postgres.id }} psql -U worksphere_ci -d worksphere_ci_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" -c "CREATE EXTENSION IF NOT EXISTS postgis;" -c "CREATE EXTENSION IF NOT EXISTS fuzzystrmatch;"
          COUNT=$(docker exec -e PGPASSWORD ${{ job.services.postgres.id }} psql -U worksphere_ci -d worksphere_ci_test -Atc "SELECT count(*) FROM pg_extension WHERE extname IN ('vector', 'pg_trgm', 'postgis', 'fuzzystrmatch');")
          echo "Installed extensions count: $COUNT"
          test "$COUNT" = "4"

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Check Prisma migration status
        run: npx prisma migrate status

      - name: Run real PostgreSQL integration tests
        run: npm run test:integration

  e2e-test:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10
    # Preserved as non-blocking (advisory) pending maintainer review
    continue-on-error: true
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xvc2luZy12dWx0dXJlLTEwLmNsZXJrLmFjY291bnRzLmRldiQ
      CLERK_SECRET_KEY: sk_test_dummy
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /ai
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /ai
      NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL: /ai
      NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL: /ai
      GROQ_API_KEY: gsk_dummy
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

