name: PR Quality Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Issue Linking
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const pr = context.payload.pull_request;
              const rawBody = pr.body || "";
              // Strip HTML comments, code blocks, and inline code to prevent false positives from templates
              const body = rawBody
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]*`/g, '');
              
              // Check for keywords like Fixes #123, Closes #123, Resolves #123, etc.
              const issueLinkRegex = /(?:closes|closed|fixes|fixed|resolves|resolved)\s*#(\d+)/gi;
              let match;
              let hasIssueLink = false;
              while ((match = issueLinkRegex.exec(body)) !== null) {
                const linkedNum = parseInt(match[1], 10);
                if (linkedNum !== pr.number && linkedNum !== 123) {
                  hasIssueLink = true;
                  break;
                }
              }
              
              const skipLinking = pr.title.toLowerCase().includes('typo') || 
                                  pr.title.toLowerCase().includes('chore') || 
                                  pr.title.toLowerCase().includes('[skip-issue]');
                                  
              if (!hasIssueLink && !skipLinking) {
                const noticeMsg = "💡 **Tip for contributor:** Please ensure your PR description links an issue (e.g. `Fixes #<issue-number>`). If no issue exists, add `[skip-issue]` or `chore` to your PR title!";
                core.warning(noticeMsg);
                console.log(noticeMsg);
              } else {
                console.log("PR issue linking validation successful.");
              }
            } catch (err) {
              console.warn("PR check warning (gracefully caught):", err.message);
            }
