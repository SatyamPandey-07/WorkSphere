name: Create Release Draft

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Normalize SHA256SUMS.txt line endings
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            tr -d '\r' < "$file" > "${file}.lf"
            mv "${file}.lf" "$file"
          done < <(find . -type f -name 'SHA256SUMS.txt' -print0)

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
