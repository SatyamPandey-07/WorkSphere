version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: worksphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worksphere
      POSTGRES_PASSWORD: worksphere_dev_password
      POSTGRES_DB: worksphere_dev
    ports:
      - "5432:5432"
    volumes:
      - worksphere_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksphere -d worksphere_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: worksphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - worksphere_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  worksphere_pgdata:
  worksphere_redisdata: