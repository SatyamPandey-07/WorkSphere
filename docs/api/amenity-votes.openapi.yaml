openapi: 3.1.0
info:
  title: WorkSphere Venue Amenity Voting API
  version: 1.0.0
  description: |
    Read and submit community votes for venue amenities. Amenity identifiers
    are restricted to the supported voting categories documented below.
servers:
  - url: /
    description: Current WorkSphere deployment
tags:
  - name: Venue Amenity Votes
    description: Venue-scoped amenity vote metrics and caller votes
  - name: Amenity Vote Submission
    description: Legacy body-scoped amenity vote submission endpoint
paths:
  /api/venues/{venueId}/amenity-votes:
    parameters:
      - $ref: "#/components/parameters/VenueId"
    get:
      operationId: getVenueAmenityVotes
      tags:
        - Venue Amenity Votes
      summary: Get amenity vote metrics for a venue
      description: Returns aggregate metrics and the authenticated caller's vote for each amenity.
      security: []
      responses:
        "200":
          description: Amenity vote metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenityMetricsResponse"
        "404":
          $ref: "#/components/responses/VenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: submitVenueAmenityVote
      tags:
        - Venue Amenity Votes
      summary: Submit or update a venue amenity vote
      security:
        - clerkBearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/AmenityVote"
      responses:
        "200":
          description: Updated amenity vote metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenityVoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteVenueAmenityVote
      tags:
        - Venue Amenity Votes
      summary: Delete the caller's vote for a venue amenity
      description: Removes the authenticated caller's vote for the selected amenity.
      security:
        - clerkBearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/AmenityId"
      responses:
        "200":
          description: Vote deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/venues/{venueId}/amenity-votes/leaderboard:
    parameters:
      - $ref: "#/components/parameters/VenueId"
    get:
      operationId: getVenueAmenityVoteLeaderboard
      tags:
        - Venue Amenity Votes
      summary: Get venue amenity voting leaderboard and rankings
      description: |
        Retrieves the community contributor leaderboard and ranked amenity
        validations for the specified venue.

        Contributor Leaderboard:
        Aggregates votes submitted across all amenity validations for the venue
        grouped by contributor. Each entry reports upvotes, downvotes, total votes
        (upvotes + downvotes), and the user's accurateVotes balance from their user
        record. User names are formatted from profile details with fallbacks to
        "Anonymous" (if name fields are empty) or "Unknown" (if no user profile
        record exists). Entries are sorted strictly in descending order of totalVotes
        and capped at the top 20 contributors. No secondary tie-breaker is applied.

        Amenity Rankings:
        Lists amenity validations for the venue. Each item details upvotes,
        downvotes, total votes (upvotes + downvotes), and a confidenceScore. The
        confidenceScore is calculated as Math.round((upvotes / total) * 100), or 100
        if no votes exist. It represents the percentage of upvotes among recorded
        votes rounded to the nearest integer, not a statistical confidence interval
        or probability. Amenities are sorted primarily by descending upvotes and
        secondarily by descending totalVotes. The amenities list is not artificially
        capped.

        Authentication & Middleware Behavior:
        The route handler does not independently call Clerk's auth() method.
        However, the endpoint is protected by WorkSphere's global Clerk middleware
        because it is not in the public route matcher. Unauthenticated requests are
        intercepted by middleware and redirected (HTTP 307 Temporary Redirect) to
        /sign-in rather than returning a 401 Unauthorized JSON response. Authenticated
        API requests require a valid Clerk session (represented by clerkBearerAuth
        or first-party browser session cookies).
      security:
        - clerkBearerAuth: []
      responses:
        "200":
          description: Venue contributor leaderboard and ranked amenity validations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenityLeaderboardResponse"
        "307":
          description: |
            Temporary redirect to /sign-in issued by Clerk middleware when
            the request lacks an authenticated session.
          headers:
            Location:
              description: Redirect URL to the sign-in page with return destination
              schema:
                type: string
        "404":
          $ref: "#/components/responses/VenueNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/venues/amenity-vote:
    get:
      operationId: getAmenityVoteEndpoint
      tags:
        - Amenity Vote Submission
      summary: Get amenity vote endpoint metadata
      description: Returns the supported amenity identifiers for clients using the body-scoped endpoint.
      security: []
      responses:
        "200":
          description: Supported amenity identifiers
          content:
            application/json:
              schema:
                type: object
                required:
                  - amenities
                properties:
                  amenities:
                    type: array
                    items:
                      $ref: "#/components/schemas/AmenityId"
        "404":
          $ref: "#/components/responses/VenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: submitAmenityVote
      tags:
        - Amenity Vote Submission
      summary: Submit or update an amenity vote
      security:
        - clerkBearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/BodyScopedAmenityVote"
      responses:
        "200":
          description: Updated amenity vote metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenityVoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteAmenityVote
      tags:
        - Amenity Vote Submission
      summary: Delete the caller's amenity vote
      description: Removes the authenticated caller's vote identified by venue and amenity.
      security:
        - clerkBearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/BodyScopedAmenityId"
      responses:
        "200":
          description: Vote deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    clerkBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token
  parameters:
    VenueId:
      name: venueId
      in: path
      required: true
      description: WorkSphere venue identifier
      schema:
        type: string
        minLength: 1
  requestBodies:
    AmenityVote:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AmenityVoteRequest"
          examples:
            upvote:
              value:
                amenity: wifi_speed
                isUpvote: true
    BodyScopedAmenityVote:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BodyScopedAmenityVoteRequest"
          examples:
            downvote:
              value:
                venueId: venue_123
                amenity: quiet_zone
                isUpvote: false
    AmenityId:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AmenityIdRequest"
          examples:
            ergonomicChair:
              value:
                amenity: ergonomic_chair
    BodyScopedAmenityId:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BodyScopedAmenityIdRequest"
          examples:
            powerOutlets:
              value:
                venueId: venue_123
                amenity: power_outlets
  schemas:
    AmenityId:
      type: string
      enum:
        - wifi_speed
        - ergonomic_chair
        - natural_light
        - quiet_zone
        - power_outlets
    AmenityIdRequest:
      type: object
      required:
        - amenity
      properties:
        amenity:
          $ref: "#/components/schemas/AmenityId"
      additionalProperties: false
    AmenityVoteRequest:
      type: object
      required:
        - amenity
        - isUpvote
      properties:
        amenity:
          $ref: "#/components/schemas/AmenityId"
        isUpvote:
          type: boolean
      additionalProperties: false
    BodyScopedAmenityVoteRequest:
      allOf:
        - $ref: "#/components/schemas/AmenityVoteRequest"
        - type: object
          required:
            - venueId
          properties:
            venueId:
              type: string
              minLength: 1
          additionalProperties: false
    BodyScopedAmenityIdRequest:
      type: object
      required:
        - venueId
        - amenity
      properties:
        venueId:
          type: string
          minLength: 1
        amenity:
          $ref: "#/components/schemas/AmenityId"
      additionalProperties: false
    AmenityMetric:
      type: object
      required:
        - confidenceScore
        - upvotes
        - downvotes
        - hidden
        - userVote
      properties:
        confidenceScore:
          type: integer
          minimum: 0
          maximum: 100
        upvotes:
          type: integer
          minimum: 0
        downvotes:
          type: integer
          minimum: 0
        hidden:
          type: boolean
        userVote:
          type:
            - boolean
            - "null"
    AmenityMetricsResponse:
      type: object
      required:
        - success
        - metrics
      properties:
        success:
          const: true
        metrics:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AmenityMetric"
    AmenityVoteResponse:
      type: object
      required:
        - success
        - amenity
        - upvotes
        - downvotes
        - confidenceScore
        - hidden
      properties:
        success:
          const: true
        amenity:
          $ref: "#/components/schemas/AmenityId"
        upvotes:
          type: integer
          minimum: 0
        downvotes:
          type: integer
          minimum: 0
        confidenceScore:
          type: integer
          minimum: 0
          maximum: 100
        hidden:
          type: boolean
    AmenityLeaderboardEntry:
      type: object
      required:
        - userId
        - name
        - upvotes
        - downvotes
        - totalVotes
        - accurateVotes
      properties:
        userId:
          type: string
          description: Contributor user identifier
        name:
          type: string
          description: Formatted user display name or fallback ("Anonymous" or "Unknown")
        upvotes:
          type: integer
          minimum: 0
          description: Total upvotes submitted across all amenity validations for this venue
        downvotes:
          type: integer
          minimum: 0
          description: Total downvotes submitted across all amenity validations for this venue
        totalVotes:
          type: integer
          minimum: 0
          description: Total votes (upvotes plus downvotes) cast by this contributor for this venue
        accurateVotes:
          type: integer
          minimum: 0
          description: Total accurate votes recorded on the user profile (defaults to 0 if user record is missing)
    AmenityLeaderboardAmenity:
      type: object
      required:
        - amenity
        - upvotes
        - downvotes
        - totalVotes
        - confidenceScore
      properties:
        amenity:
          type: string
          description: Amenity identifier
        upvotes:
          type: integer
          minimum: 0
          description: Total positive community validations for this amenity
        downvotes:
          type: integer
          minimum: 0
          description: Total negative community validations for this amenity
        totalVotes:
          type: integer
          minimum: 0
          description: Total validations (upvotes + downvotes) recorded for this amenity
        confidenceScore:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Percentage of upvotes among recorded votes (0-100), rounded to the nearest
            integer. Defaults to 100 when totalVotes is 0.
    AmenityLeaderboardResponse:
      type: object
      required:
        - success
        - leaderboard
        - amenities
      properties:
        success:
          const: true
        leaderboard:
          type: array
          maxItems: 20
          description: Top contributors ordered descending by totalVotes (capped at 20 users)
          items:
            $ref: "#/components/schemas/AmenityLeaderboardEntry"
        amenities:
          type: array
          description: Ranked venue amenity validations sorted by descending upvotes, then descending totalVotes
          items:
            $ref: "#/components/schemas/AmenityLeaderboardAmenity"
      example:
        success: true
        leaderboard:
          - userId: user_123
            name: Example User
            upvotes: 12
            downvotes: 3
            totalVotes: 15
            accurateVotes: 8
        amenities:
          - amenity: wifi_speed
            upvotes: 18
            downvotes: 2
            totalVotes: 20
            confidenceScore: 90
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          const: true
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          const: false
        error:
          type: string
        code:
          type: string
    ErrorResponseWithoutSuccess:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
    UnauthorizedError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code:
              const: UNAUTHORIZED
    VenueNotFoundError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code:
              const: VENUE_NOT_FOUND
    RateLimitedError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponseWithoutSuccess"
        - type: object
          properties:
            code:
              const: RATE_LIMITED
  responses:
    BadRequest:
      description: Invalid request body or unsupported amenity identifier
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: Missing required parameters
            code: VALIDATION_FAILED
    Unauthorized:
      description: Clerk authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
          example:
            success: false
            error: Unauthorized
            code: UNAUTHORIZED
    VenueNotFound:
      description: Venue was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VenueNotFoundError"
          example:
            success: false
            error: Venue not found
            code: VENUE_NOT_FOUND
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
          example:
            error: Rate limited
            code: RATE_LIMITED
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
