syntax = "proto3";

package worksphere.telemetry;

enum EventType {
  UNKNOWN = 0;
  TELEMETRY = 1;
  PRESENCE = 2;
  CHAT = 3;
}

message TelemetryEvent {
  string venue_id = 1;
  string device_id = 2;
  string reading_type = 3;
  double value = 4;
  int64 timestamp = 5;
}

message PresenceEvent {
  string user_id = 1;
  string venue_id = 2;
  string status = 3;
  int64 last_active = 4;
}

message ChatEvent {
  string message_id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string content = 4;
  int64 timestamp = 5;
}

message WorkSphereEnvelope {
  EventType type = 1;
  int64 sequence_id = 2;
 feature/solana-escrow-refund
  
 feature/protobuf-binary-broker


  
 main
 main
  oneof payload {
    TelemetryEvent telemetry = 3;
    PresenceEvent presence = 4;
    ChatEvent chat = 5;
  }
 feature/solana-escrow-refund
}

 feature/protobuf-binary-broker
}

}
 main
 main
